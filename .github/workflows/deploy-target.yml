name: Deploy target (reusable)

# Deploys one target on the factory VM and checks it. Called by deploy.yml
# (events) and lander.yml (human approval). Production runs also report the
# result on factory issues linked to the deployed PR.
on:
  workflow_call:
    inputs:
      kind:
        description: prod or preview
        type: string
        required: true
      sha:
        type: string
        required: true
      pr:
        description: PR number (preview only)
        type: string
        default: ""

env:
  DOMAIN: domigo.com
  PROJECT_LOGIN: TomTXR
  PROJECT_NUMBER: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Same group as the cleanup of that PR: cleanup cancels a running preview deploy.
    concurrency:
      group: ${{ inputs.kind == 'prod' && 'production' || format('preview-{0}', inputs.pr) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Resolve target
        id: target
        env:
          KIND: ${{ inputs.kind }}
          SHA: ${{ inputs.sha }}
          PR: ${{ inputs.pr }}
        run: |
          if [ "$KIND" = "prod" ]; then
            echo "args=deploy prod $SHA" >> "$GITHUB_OUTPUT"
            echo "host=pilot.$DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "args=deploy pr $PR $SHA" >> "$GITHUB_OUTPUT"
            echo "host=pilot-pr-$PR.$DOMAIN" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure preview DNS record
        if: inputs.kind == 'preview'
        env:
          CF_DNS_TOKEN: ${{ secrets.CF_DNS_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          FACTORY_IP: ${{ vars.FACTORY_IP }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          if [ -z "$CF_DNS_TOKEN" ]; then echo "::warning::CF_DNS_TOKEN not set, skipping DNS"; exit 0; fi
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records"
          existing=$(curl -fsS -H "Authorization: Bearer $CF_DNS_TOKEN" "$api?type=A&name=$HOST" | jq -r '.result[0].id // empty')
          if [ -z "$existing" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CF_DNS_TOKEN" -H "Content-Type: application/json" "$api" \
              -d "{\"type\":\"A\",\"name\":\"$HOST\",\"content\":\"$FACTORY_IP\",\"proxied\":true,\"ttl\":1,\"comment\":\"factory-pilot preview\"}" > /dev/null
            echo "created $HOST"
          else
            echo "exists $HOST"
          fi

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.FACTORY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FACTORY_KNOWN_HOSTS }}
          FACTORY_IP: ${{ vars.FACTORY_IP }}
          ARGS: ${{ steps.target.outputs.args }}
          # App secrets: repository secrets named PILOT_<NAME>, production only.
          # Previews and CI never get them (the app must work there without).
          APP_SECRETS: ${{ inputs.kind == 'prod' && toJSON(secrets) || '{}' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Secrets go over stdin as NAME=value lines (single-line values only), never as arguments.
          printf '%s' "$APP_SECRETS" | jq -r 'to_entries[] | select((.key | test("^PILOT_[A-Z0-9_]+$")) and (.value | test("\n") | not)) | "\(.key)=\(.value)"' > app.env
          echo "app secrets passed: $(cut -d= -f1 app.env | paste -sd' ' -)"
          ssh -i ~/.ssh/deploy_key "deploy@$FACTORY_IP" "$ARGS" < app.env
          rm -f app.env

      - name: Smoke check
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$HOST/api/health" | grep -q '"status":"ok"'; then echo "healthy: https://$HOST"; exit 0; fi
            sleep 10
          done
          echo "::error::https://$HOST did not become healthy"; exit 1

      - name: Post preview link on the PR
        if: inputs.kind == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HOST: ${{ steps.target.outputs.host }}
          SHA: ${{ inputs.sha }}
        run: |
          body="Preview ready: https://$HOST (commit ${SHA:0:7}). CI passed."
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Ready for human review?
        if: inputs.kind == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_AGENT_LOGINS: ${{ vars.FACTORY_AGENT_LOGINS }}
          FACTORY_APPROVERS: ${{ vars.FACTORY_APPROVERS }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_LOGIN: TomTXR
          PROJECT_NUMBER: "1"
        run: .github/scripts/factory-flow.sh ready-check "${{ inputs.pr }}"

      - name: Report production result on linked issues
        if: always() && inputs.kind == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          FACTORY_APPROVERS: ${{ vars.FACTORY_APPROVERS }}
          SHA: ${{ inputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          # Factory stories only: issues linked to the PR of this commit that carry factory:deploying
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || { echo "no PR for $SHA"; exit 0; }
          issues=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ pullRequest(number:$n){ closingIssuesReferences(first:10){ nodes { number id labels(first:30){ nodes { name } } } } } } }' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$pr" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select([.labels.nodes[].name] | index("factory:deploying")) | "\(.number) \(.id)"')
          echo "$issues" | while read -r i node; do
            [ -n "$i" ] || continue
            if [ "$RESULT" = "success" ]; then
              gh issue edit "$i" --repo "$GITHUB_REPOSITORY" --remove-label factory:deploying --add-label factory:done
              .github/scripts/board-status.sh "$node" Done
              .github/scripts/factory-flow.sh status "$i" "Done: deployed to production https://pilot.$DOMAIN (commit ${SHA:0:7}, PR #$pr)."
              # Closing keywords do not apply when GITHUB_TOKEN merged the PR (lander), so close explicitly.
              gh issue close "$i" --repo "$GITHUB_REPOSITORY" --reason completed 2>/dev/null || true
              # Closing by GITHUB_TOKEN fires no event: run the close follow-ups here
              # (next part of a split, parent close, waiting stories this one blocked).
              .github/scripts/factory-flow.sh closed "$i" completed || echo "::warning::close follow-ups failed for #$i"
            else
              gh issue edit "$i" --repo "$GITHUB_REPOSITORY" --remove-label factory:deploying --add-label factory:blocked
              .github/scripts/board-status.sh "$node" Blocked
              .github/scripts/factory-flow.sh notify "$i" "**Blocked:** the production deploy of commit ${SHA:0:7} (PR #$pr) failed. Check $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, then reply \`/retry\`."
            fi
          done
