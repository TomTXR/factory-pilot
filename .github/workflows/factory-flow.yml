name: Factory flow

# State transitions between agent steps (see .github/scripts/factory-flow.sh).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled, opened, closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: factory-flow-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  FACTORY_AGENT_LOGINS: ${{ vars.FACTORY_AGENT_LOGINS }}
  FACTORY_APPROVERS: ${{ vars.FACTORY_APPROVERS }}
  PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
  PROJECT_LOGIN: TomTXR
  PROJECT_NUMBER: "1"

jobs:
  pr-updated:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'factory/issue-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.run.outputs.prs }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - id: run
        run: |
          out=$(mktemp); GITHUB_OUTPUT="$out" .github/scripts/factory-flow.sh pr-updated "${{ github.event.pull_request.number }}"
          echo "prs=$(grep '^cleanup_pr=' "$out" | cut -d= -f2 | jq -Rsc 'split("\n") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  review:
    if: github.event_name == 'pull_request_review' && startsWith(github.event.pull_request.head.ref, 'factory/issue-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/factory-flow.sh review "${{ github.event.pull_request.number }}" "${{ github.event.review.id }}"

  human-rework:
    # A human asks for changes: label factory:rework plus a comment on the issue.
    if: github.event_name == 'issues' && github.event.label.name == 'factory:rework' && github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - env:
          ISSUE: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          APPROVERS: ${{ vars.FACTORY_APPROVERS }}
        run: |
          if [ -z "$APPROVERS" ] || ! echo ",$APPROVERS," | grep -qi ",$SENDER,"; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:rework
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Rework ignored: $SENDER is not on the approver list. Label removed."
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq "[.[] | select(.user.login==\"$SENDER\")] | last | .html_url // \"\"")
          .github/scripts/factory-flow.sh rework "$ISSUE" "Rework requested by $SENDER. See the latest comment: $last"

  plan-ready:
    # The breakdown agent moved the story to the human gate.
    if: github.event_name == 'issues' && github.event.label.name == 'factory:plan-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/factory-flow.sh plan-ready "${{ github.event.issue.number }}"

  start:
    # A new story starts the breakdown without any label work by the human.
    # Only stories opened by approvers start on their own (public repository).
    if: >
      github.event_name == 'issues' && github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'factory:story') &&
      contains(format(',{0},', vars.FACTORY_APPROVERS), format(',{0},', github.event.issue.user.login))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/factory-flow.sh start "${{ github.event.issue.number }}"

  closed:
    # Closed by anyone: not planned -> cancelled (PRs closed, previews removed),
    # completed -> board Done. A close done by the factory itself (GITHUB_TOKEN)
    # triggers no event; that path runs the same script inline.
    if: github.event_name == 'issues' && github.event.action == 'closed' && contains(github.event.issue.labels.*.name, 'factory:story')
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.run.outputs.prs }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - id: run
        env:
          REASON: ${{ github.event.issue.state_reason }}
        run: |
          out=$(mktemp); GITHUB_OUTPUT="$out" .github/scripts/factory-flow.sh closed "${{ github.event.issue.number }}" "$REASON"
          echo "prs=$(grep '^cleanup_pr=' "$out" | cut -d= -f2 | jq -Rsc 'split("\n") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  agent-blocked:
    # An agent stopped on purpose: it commented why and set factory:blocked (AGENTS.md).
    # Labels set with the agents' token trigger workflows; the factory's own do not.
    if: >
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'factory:blocked' &&
      contains(format(',{0},', vars.FACTORY_AGENT_LOGINS), format(',{0},', github.event.sender.login))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/factory-flow.sh agent-blocked "${{ github.event.issue.number }}"

  closed-other:
    # Any other closed issue (bug, infra ticket, human task) can block a story
    # (GitHub "blocked by"): release waiting stories it blocked.
    if: github.event_name == 'issues' && github.event.action == 'closed' && !contains(github.event.issue.labels.*.name, 'factory:story')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/factory-flow.sh unblock "${{ github.event.issue.number }}"

  closed-cleanup:
    needs: closed
    if: needs.closed.outputs.prs != '' && needs.closed.outputs.prs != '[]'
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.closed.outputs.prs) }}
    uses: ./.github/workflows/preview-cleanup.yml
    with:
      pr: ${{ matrix.pr }}
    secrets: inherit

  reopened:
    if: github.event_name == 'issues' && github.event.action == 'reopened' && contains(github.event.issue.labels.*.name, 'factory:story')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/factory-flow.sh reopened "${{ github.event.issue.number }}"

  pr-updated-cleanup:
    # A late builder PR on a cancelled story was closed above: remove its preview.
    needs: pr-updated
    if: needs.pr-updated.outputs.prs != '' && needs.pr-updated.outputs.prs != '[]'
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.pr-updated.outputs.prs) }}
    uses: ./.github/workflows/preview-cleanup.yml
    with:
      pr: ${{ matrix.pr }}
    secrets: inherit
