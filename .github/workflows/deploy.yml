name: Deploy

# Event entry point. Green CI on main -> production; green CI on an open PR ->
# preview; closed PR -> preview removed. The work is done by the reusable
# workflows deploy-target.yml and preview-cleanup.yml (also used by lander.yml).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  resolve:
    # Only green CI runs from this repository (never from forks).
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.r.outputs.kind }}
      pr: ${{ steps.r.outputs.pr }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = "main" ]; then
            echo "kind=prod" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            if [ "$state" = "OPEN" ]; then
              echo "kind=preview" >> "$GITHUB_OUTPUT"; echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            else
              echo "PR #$PR_NUMBER is $state, skipping preview deploy"
            fi
          fi

  deploy:
    needs: resolve
    if: needs.resolve.outputs.kind != ''
    uses: ./.github/workflows/deploy-target.yml
    with:
      kind: ${{ needs.resolve.outputs.kind }}
      sha: ${{ github.event.workflow_run.head_sha }}
      pr: ${{ needs.resolve.outputs.pr }}
    secrets: inherit

  cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/preview-cleanup.yml
    with:
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit
