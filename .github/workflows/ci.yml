name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read   # the criteria check reads the story's plan

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the knowledge check diffs against the PR base
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm run setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Board script tests
        run: bash tests/board-status.test.sh
      - name: Factory flow script tests
        run: bash tests/factory-flow.test.sh && bash tests/pilot-deploy-env.test.sh && bash tests/knowledge-check.test.sh && bash tests/wiki-index.test.sh && bash tests/criteria-check.test.sh
      - name: Knowledge wiki is updated with the change
        # Last and also after a failure: the CI-failure rework then reports all failures in one round.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:   # via env, not inline: branch names are untrusted input
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
        run: git diff --name-only "origin/$BASE...HEAD" | bash .github/scripts/knowledge-check.sh "$BRANCH"
      - name: Every acceptance criterion has a test
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:   # via env, not inline: branch names and PR text are untrusted input
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FACTORY_AGENT_LOGINS: ${{ vars.FACTORY_AGENT_LOGINS }}
        run: bash .github/scripts/criteria-check.sh "$BRANCH"
      - name: Wiki index is generated from the articles
        if: ${{ !cancelled() }}
        run: node .github/scripts/wiki-index.mjs --check

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
      - run: docker compose up -d --build --wait
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
