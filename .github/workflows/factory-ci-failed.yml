name: Factory CI failed

# The reviewer agent does not review a PR whose required checks are red. Without
# this workflow a failing factory PR waited in "Agent: Reviewing" with no agent
# working on it (#34, PR #39). A failed CI run on a factory branch now sends the
# PR back to the builder with the failing jobs and error lines (counts as a rework).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: factory-flow-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  ci-failed:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'factory/issue-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORY_AGENT_LOGINS: ${{ vars.FACTORY_AGENT_LOGINS }}
      FACTORY_APPROVERS: ${{ vars.FACTORY_APPROVERS }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_LOGIN: TomTXR
      PROJECT_NUMBER: "1"
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - run: |
          # pull_requests can be empty for some runs: find the PR by its branch.
          pr="${PR:-$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" | jq -r --arg b "$BRANCH" '.[] | select(.head.ref == $b) | .number' | head -1)}"
          [ -n "$pr" ] || { echo "no open PR for $BRANCH"; exit 0; }
          .github/scripts/factory-flow.sh ci-failed "$pr" "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.head_sha }}"
