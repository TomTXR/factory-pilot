name: Land (reusable)

# Merge the story's single open PR (green required checks only), deploy to
# production and clean up the preview. Called by lander.yml (label, legacy)
# and factory-command.yml (/approve at Human Review).
on:
  workflow_call:
    inputs:
      issue:
        type: string
        required: true
      approver:
        description: GitHub login of the human who approved the release
        type: string
        required: true

concurrency:
  group: lander-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.merge.outputs.sha }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      SENDER: ${{ inputs.approver }}
      SENDER_TYPE: User
      APPROVERS: ${{ vars.FACTORY_APPROVERS }}
      FACTORY_APPROVERS: ${{ vars.FACTORY_APPROVERS }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_LOGIN: TomTXR
      PROJECT_NUMBER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Resolve issue node
        run: echo "NODE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .node_id)" >> "$GITHUB_ENV"

      - name: Check the approver
        run: |
          # Comma-separated allow-list in repository variable FACTORY_APPROVERS.
          if [ "$SENDER_TYPE" != "User" ] || [ -z "$APPROVERS" ] || ! echo ",$APPROVERS," | grep -qi ",$SENDER,"; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Approval ignored: $SENDER ($SENDER_TYPE) is not on the approver list. Label removed."
            exit 1
          fi
          echo "approved by $SENDER"

      - name: Find the story's open PR
        id: pr
        run: |
          pr=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ issue(number:$n){ closedByPullRequestsReferences(first:5, includeClosedPrs:false){ nodes { number state } } } } }' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$ISSUE" \
            --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[] | select(.state=="OPEN") | .number] | if length==1 then .[0] else "" end')
          if [ -z "$pr" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production --add-label factory:blocked
            .github/scripts/board-status.sh "$NODE" Blocked
            .github/scripts/factory-flow.sh notify "$ISSUE" "**Blocked:** cannot release: expected exactly one open PR that closes this issue (\`Closes #$ISSUE\`). Decide, then reply \`/retry\`."
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Bring the PR up to date and wait for required checks
        id: ready
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then gh pr update-branch "$PR" --repo "$GITHUB_REPOSITORY"; sleep 15; fi  # merge, not rebase: branches may contain merge commits
          for i in $(seq 1 100); do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
            case "$state" in
              CLEAN|HAS_HOOKS|UNSTABLE) echo "mergeable: $state"; exit 0 ;;
              DIRTY)
                # Conflict with main (e.g. another story was merged first). Only the
                # builder's own PR (factory/issue-<n>) can be revised by the builder;
                # any other branch blocks for a human as before.
                head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
                [ "$head" = "factory/issue-$ISSUE" ] || break
                .github/scripts/factory-flow.sh rework "$ISSUE" "$(printf 'The release of PR #%s was stopped: it conflicts with the current `main` (another change was merged first). Merge the current `main` into this branch, resolve the conflicts so that both the existing features on `main` and this story work, run all checks, and push.' "$PR")"
                echo "conflict=true" >> "$GITHUB_OUTPUT"
                # The script may have blocked the story (rework limit); its message is then final.
                if gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | index("factory:rework")' | grep -qv null; then
                  .github/scripts/factory-flow.sh status "$ISSUE" "The approved release could not be merged: PR #$PR conflicts with the current main. Agent: Reworking resolves the conflict; a new test request follows and needs a new /approve."
                fi
                exit 0 ;;
              BLOCKED_BY_FAILURE) break ;;
            esac
            if gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --required 2>/dev/null | awk '{print $2}' | grep -q fail; then break; fi
            sleep 15
          done
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production --add-label factory:blocked
          .github/scripts/board-status.sh "$NODE" Blocked
          .github/scripts/factory-flow.sh notify "$ISSUE" "**Blocked:** cannot release PR #$PR: merge state \`$state\` (conflict, failing or missing required checks). Decide, then reply \`/retry\`."
          exit 1

      - name: Merge
        id: merge
        if: steps.ready.outputs.conflict != 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # Squash: works for any mergeable PR, also when the builder resolved a conflict
          # with a merge commit (rebase fails then: "This branch can't be rebased"),
          # and keeps the linear history that branch protection requires.
          if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production --add-label factory:blocked
            .github/scripts/board-status.sh "$NODE" Blocked
            .github/scripts/factory-flow.sh notify "$ISSUE" "**Blocked:** the approved release of PR #$PR could not be merged (see the Land run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Nothing was deployed. Reply \`/retry\` after the cause is fixed."
            exit 1
          fi
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production --add-label factory:deploying
          .github/scripts/board-status.sh "$NODE" Deploying
          .github/scripts/factory-flow.sh status "$ISSUE" "Release approved by $SENDER. Merged PR #$PR as ${sha:0:7}. Agent: Deploying; Done after the deploy and smoke check pass."

  # Merges by GITHUB_TOKEN trigger no further workflows (no push, no PR closed),
  # so deploy and cleanup run here as reusable workflow calls.
  deploy:
    needs: land
    if: needs.land.outputs.sha != ''
    uses: ./.github/workflows/deploy-target.yml
    with:
      kind: prod
      sha: ${{ needs.land.outputs.sha }}
    secrets: inherit

  cleanup:
    needs: land
    if: needs.land.outputs.sha != ''
    uses: ./.github/workflows/preview-cleanup.yml
    with:
      pr: ${{ needs.land.outputs.pr }}
    secrets: inherit
