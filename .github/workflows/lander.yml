name: Lander

# Human gate -> agent action. When an allow-listed human sets
# factory:approved-for-production on a story issue, merge the story's open PR
# (only with green required checks) and start the production pipeline.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: lander-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  land:
    if: github.event.label.name == 'factory:approved-for-production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
      SENDER_TYPE: ${{ github.event.sender.type }}
      APPROVERS: ${{ vars.FACTORY_APPROVERS }}
      NODE: ${{ github.event.issue.node_id }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_LOGIN: TomTXR
      PROJECT_NUMBER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Check the approver
        run: |
          # Comma-separated allow-list in repository variable FACTORY_APPROVERS.
          if [ "$SENDER_TYPE" != "User" ] || [ -z "$APPROVERS" ] || ! echo ",$APPROVERS," | grep -qi ",$SENDER,"; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Approval ignored: @$SENDER ($SENDER_TYPE) is not on the approver list. Label removed."
            exit 1
          fi
          echo "approved by $SENDER"

      - name: Find the story's open PR
        id: pr
        run: |
          pr=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ issue(number:$n){ closedByPullRequestsReferences(first:5, includeClosedPrs:false){ nodes { number state } } } } }' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$ISSUE" \
            --jq '[.data.repository.issue.closedByPullRequestsReferences.nodes[] | select(.state=="OPEN") | .number] | if length==1 then .[0] else "" end')
          if [ -z "$pr" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production --add-label factory:blocked
            .github/scripts/board-status.sh "$NODE" Blocked
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Cannot land: expected exactly one open PR that closes this issue (\`Closes #$ISSUE\`)."
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Bring the PR up to date and wait for required checks
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then gh pr update-branch "$PR" --repo "$GITHUB_REPOSITORY" --rebase; sleep 15; fi
          for i in $(seq 1 100); do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
            case "$state" in
              CLEAN|HAS_HOOKS|UNSTABLE) echo "mergeable: $state"; exit 0 ;;
              DIRTY|BLOCKED_BY_FAILURE) break ;;
            esac
            if gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --required 2>/dev/null | awk '{print $2}' | grep -q fail; then break; fi
            sleep 15
          done
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production --add-label factory:blocked
          .github/scripts/board-status.sh "$NODE" Blocked
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Cannot land PR #$PR: merge state \`$state\` (conflict, failing or missing required checks). Needs a human."
          exit 1

      - name: Merge and start production
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --rebase --delete-branch
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label factory:approved-for-production --add-label factory:deploying
          .github/scripts/board-status.sh "$NODE" Deploying
          # A merge by GITHUB_TOKEN does not trigger push workflows; dispatch CI on main explicitly.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Approved by @$SENDER. Merged PR #$PR. Production pipeline started; this issue moves to Done after the deploy and smoke check pass."
