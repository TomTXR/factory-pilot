name: Lander

# Legacy entry point: an approver sets factory:approved-for-production by hand.
# The normal path is the comment command /approve (factory-command.yml).
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write

jobs:
  land:
    if: github.event.label.name == 'factory:approved-for-production' && github.event.sender.type == 'User'
    uses: ./.github/workflows/land.yml
    with:
      issue: ${{ github.event.issue.number }}
      approver: ${{ github.event.sender.login }}
    secrets: inherit
