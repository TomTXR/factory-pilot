name: Factory command

# Humans steer stories with comments: /approve, /changes <text>, /retry, or plain
# text whose intent is inferred at Plan Review and Human Review. Only approvers
# count, and only their comments reach the classifier (no quota for strangers).
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write

concurrency:
  group: factory-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: >
      !github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(format(',{0},', vars.FACTORY_APPROVERS), format(',{0},', github.event.comment.user.login))
    runs-on: ubuntu-latest
    outputs:
      land: ${{ steps.run.outputs.land }}
      prs: ${{ steps.run.outputs.prs }}
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORY_AGENT_LOGINS: ${{ vars.FACTORY_AGENT_LOGINS }}
      FACTORY_APPROVERS: ${{ vars.FACTORY_APPROVERS }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_LOGIN: TomTXR
      PROJECT_NUMBER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Install Claude Code CLI (intent classifier)
        run: npm install -g @anthropic-ai/claude-code@2.1.228 --no-audit --no-fund --loglevel=error
      - id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Each step has its own output file: collect the script's outputs here,
          # including PRs closed by /cancel (closing by GITHUB_TOKEN triggers no event).
          out=$(mktemp)
          GITHUB_OUTPUT="$out" .github/scripts/factory-flow.sh command "${{ github.event.issue.number }}" "${{ github.event.comment.id }}"
          grep '^land=' "$out" >> "$GITHUB_OUTPUT" || true
          echo "prs=$(grep '^cleanup_pr=' "$out" | cut -d= -f2 | jq -Rsc 'split("\n") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  land:
    needs: command
    if: needs.command.outputs.land == 'true'
    uses: ./.github/workflows/land.yml
    with:
      issue: ${{ github.event.issue.number }}
      approver: ${{ github.event.comment.user.login }}
    secrets: inherit

  cleanup:
    needs: command
    if: needs.command.outputs.prs != '' && needs.command.outputs.prs != '[]'
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.command.outputs.prs) }}
    uses: ./.github/workflows/preview-cleanup.yml
    with:
      pr: ${{ matrix.pr }}
    secrets: inherit
