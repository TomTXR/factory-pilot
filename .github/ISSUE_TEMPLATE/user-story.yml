name: User story
description: A new user story for the software factory
title: "[Story] "
labels: ["factory:story"]
body:
  - type: markdown
    attributes:
      value: |
        Write what you want, not how to build it. The breakdown agent reads this, checks the knowledge wiki, and asks questions in the comments.
        When the story is ready, add the label `factory:breakdown` to start.
  - type: textarea
    id: story
    attributes:
      label: Story
      description: "As a <user>, I want <goal>, so that <reason>."
      placeholder: "As a home owner, I want to ..., so that ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements. One per line.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What must NOT be built as part of this story.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context and references
      description: Links, wiki articles, screenshots, designs. Optional.
    validations:
      required: false
