# Edge proxy on the factory VM. Installed to /srv/edge/.
name: edge

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    mem_limit: 256m

networks:
  edge:
    name: factory-edge
    external: true

volumes:
  caddy-data:
  caddy-config:
